name: Performance evidence
on:
  pull_request:
    paths:
      - '**.go'
      - 'scripts/perf_baseline.py'
      - 'scripts/update_performance_ratchets.py'
      - 'testdata/performance-ratchets.json'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  deterministic-ratchets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/update_performance_ratchets.py
      - name: End-to-end journey evidence
        run: python scripts/perf_baseline.py --sizes 100,1000 --samples 5 --output performance-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elephant-performance-${{ github.run_id }}
          path: performance-report.json
  scheduled-scale-baseline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/perf_baseline.py --sizes 100,1000,10000 --samples 10 --output performance-scale-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elephant-performance-scale-${{ github.run_id }}
          path: performance-scale-report.json
