title = "Elephant secret scan"

[extend]
useDefault = true

# These commits only added synthetic dashboard and credential-format fixtures.
# The files are gone. The allowlist keeps that history from failing the gate
# without ignoring secrets introduced in any other commit.
[[allowlists]]
description = "Removed synthetic test fixtures, not deployed credentials"
commits = [
  "98dd9b631aee521f4a4b389bd9bc322e59e1338a",
  "79787b401e661d31c64bce223137bf2abee4b39c",
]
paths = [
  '''(^|/)dashboard_test.go$''',
  '''(^|/)sensitive_test.go$''',
]

# Public model artifact SHA-256 values, not authentication tokens.
# Match only these six exact manifest lines inside the two frozen result files.
[[allowlists]]
description = "Verified public tokenizer artifact checksums in frozen memory-tax results"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^experiments/memory_tax/results/(dev|holdout)\.json$''']
regexes = [
  '''^\s*"models--Xenova--ms-marco-MiniLM-L-6-v2/snapshots/a09144355adeed5f58c8ed011d209bf8ee5a1fec/special_tokens_map\.json": "b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3",?$''',
  '''^\s*"models--Xenova--ms-marco-MiniLM-L-6-v2/snapshots/a09144355adeed5f58c8ed011d209bf8ee5a1fec/tokenizer\.json": "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66",?$''',
  '''^\s*"models--Xenova--ms-marco-MiniLM-L-6-v2/snapshots/a09144355adeed5f58c8ed011d209bf8ee5a1fec/tokenizer_config\.json": "0b29c7bfc889e53b36d9dd3e686dd4300f6525110eaa98c76a5dafceb2029f53",?$''',
  '''^\s*"models--qdrant--bge-small-en-v1\.5-onnx-q/snapshots/aa8f8b060edb00e03bfdd08813a2949946c8ba55/special_tokens_map\.json": "5d5b662e421ea9fac075174bb0688ee0d9431699900b90662acd44b2a350503a",?$''',
  '''^\s*"models--qdrant--bge-small-en-v1\.5-onnx-q/snapshots/aa8f8b060edb00e03bfdd08813a2949946c8ba55/tokenizer\.json": "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66",?$''',
  '''^\s*"models--qdrant--bge-small-en-v1\.5-onnx-q/snapshots/aa8f8b060edb00e03bfdd08813a2949946c8ba55/tokenizer_config\.json": "0b29c7bfc889e53b36d9dd3e686dd4300f6525110eaa98c76a5dafceb2029f53",?$''',
]
