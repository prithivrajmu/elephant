name: Validate Elephant
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
  minimum-go:
    name: Minimum Go 1.25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # setup-go reads the go directive only, not toolchain, so the floor is selected here.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Vet and test the go.mod floor
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          go version
          go vet ./...
          go test ./...
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Tests and vet
        shell: bash
        run: |
          go test -race ./...
          go vet ./...
      - name: Format, modules, and vulnerabilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          test -z "$(gofmt -l .)"
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Native binary and self-test
        shell: bash
        run: |
          go build -buildvcs=false -o elephant-test ./cmd/elephant
          ./elephant-test selftest
          python scripts/acceptance.py ./elephant-test
          python scripts/storage_acceptance.py ./elephant-test
      - name: Automatic hook acceptance
        if: runner.os != 'Windows'
        run: python scripts/automation_acceptance.py ./elephant-test
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python scripts/build_release.py
      - run: node scripts/dashboard_update_check.js
      - run: python scripts/package_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elephant-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
  package-native:
    name: Native package
    needs: packages
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elephant-packages
          path: dist
      - name: Execute the archive for this runner
        run: python scripts/package_acceptance.py --native
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full history with pinned gitleaks
        shell: bash
        run: |
          set -eu
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          work="$RUNNER_TEMP/gitleaks"
          mkdir -p "$work"
          curl -fsSL -o "$work/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | (cd "$work" && sha256sum -c -)
          tar -xzf "$work/$archive" -C "$work" gitleaks
          "$work/gitleaks" detect --source "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner --exit-code 1
  publish:
    needs: [native, packages, package-native, cloudflare, minimum-go, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: elephant-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elephant-packages
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
